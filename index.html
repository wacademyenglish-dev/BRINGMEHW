<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOLFFY Mobile HW: Bring Me To Life</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Oswald:wght@400;600;700&family=Outfit:wght@300;400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gothic: {
                            black: '#030305',
                            panel: '#0f172a',
                            gray: '#334155',
                            cyan: '#00f3ff',
                            red: '#ff003c',
                            white: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                        impact: ['Oswald', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace']
                    },
                    boxShadow: {
                        'cyan-glow': '0 0 15px rgba(0,243,255,0.4), inset 0 0 10px rgba(0,243,255,0.1)',
                        'red-glow': '0 0 15px rgba(255,0,60,0.5), inset 0 0 10px rgba(255,0,60,0.2)',
                        'panel': 'inset 0 2px 10px rgba(255,255,255,0.02), 0 10px 20px rgba(0,0,0,0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Base & Resets */
        body {
            background-color: #030305;
            background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, #030305 70%);
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* Mobile Wrapper Simulator */
        .mobile-wrapper {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 100vh;
            background-color: #030305;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        @media (min-width: 640px) {
            .mobile-wrapper {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #0f172a;
                box-shadow: 0 25px 50px -12px rgba(0, 243, 255, 0.2), inset 0 0 0 4px #030305;
            }
        }

        /* Custom Scrollbar */
        .mobile-wrapper::-webkit-scrollbar { width: 6px; }
        .mobile-wrapper::-webkit-scrollbar-track { background: #030305; }
        .mobile-wrapper::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 10px; }

        /* Card styles */
        .question-card {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .question-card.active {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .option-btn {
            transition: all 0.2s;
            border-left: 4px solid transparent;
            background-color: #030305;
            border: 1px solid #334155;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(0, 243, 255, 0.05);
            border-left-color: #00f3ff;
            border-color: #00f3ff;
            transform: translateX(4px);
        }
        .option-btn.correct { background-color: #00f3ff !important; color: #030305 !important; border-color: #00f3ff !important; font-weight: bold; box-shadow: 0 0 15px rgba(0,243,255,0.4);}
        .option-btn.wrong { background-color: #ff003c !important; color: white !important; border-color: #ff003c !important; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,60,0.4);}
        .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ff003c !important;}
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }

        .confetti { position: absolute; width: 6px; height: 16px; opacity: 0; z-index: 100; border-radius: 2px;}
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .progress-point { transition: all 0.3s; }
        .progress-point.filled { background-color: #00f3ff; box-shadow: 0 0 8px #00f3ff; border-color: #00f3ff; }

        /* Vinyl Spin */
        .vinyl-spin { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="mobile-wrapper" id="app-container">
        
        <!-- Sticky Header with Progress -->
        <header class="sticky top-0 z-50 bg-[#030305]/95 backdrop-blur-md border-b border-gothic-cyan/30 px-6 pt-5 pb-3 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="font-impact font-black text-gothic-cyan tracking-widest text-xl uppercase">WOLFFY <span class="text-white">A2</span></h1>
                    <p class="font-mono text-[10px] text-gray-400 uppercase tracking-widest font-bold">HW TAPE • EVANESCENCE</p>
                </div>
                <div class="text-right bg-gothic-panel px-3 py-1 rounded border border-[#334155]">
                    <span id="score-counter" class="font-mono text-xs font-bold text-gothic-cyan tracking-widest uppercase">SCORE: 0/15</span>
                </div>
            </div>
            <!-- Visual Progress Dots -->
            <div class="flex justify-between gap-1 mb-1" id="progress-container">
                <!-- Dots injected via JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 pb-32 space-y-6">
            
            <!-- Intro Data Disc -->
            <div class="bg-gothic-panel p-5 rounded-xl shadow-panel border border-[#334155] relative overflow-hidden flex flex-col items-center text-center">
                <div class="w-24 h-24 rounded-full border-4 border-gothic-cyan border-t-transparent animate-spin mb-4 shadow-cyan-glow flex items-center justify-center">
                    <div class="w-20 h-20 rounded-full overflow-hidden vinyl-spin border-2 border-black" style="animation-duration: 3s;">
                        <img src="https://upload.wikimedia.org/wikipedia/en/2/25/Evanescence_-_Fallen.png" class="w-full h-full object-cover opacity-90 grayscale">
                    </div>
                </div>

                <div class="w-full bg-[#030305] mt-2 p-3 text-center border border-[#334155] rounded-lg">
                    <h2 class="font-impact font-black text-white text-2xl uppercase leading-none tracking-wide">Rescue Quiz</h2>
                    <p class="font-mono text-[10px] font-bold text-gothic-cyan mt-1 uppercase tracking-widest">Commands & Pronouns</p>
                </div>
            </div>

            <!-- Quiz Questions Container -->
            <div id="quiz-container" class="space-y-6 relative z-10">
                <!-- Questions will be injected here -->
            </div>

        </main>

        <!-- Fixed Submit Button Footer -->
        <div class="sticky bottom-0 left-0 w-full bg-gradient-to-t from-[#030305] via-[#030305] to-transparent pt-12 pb-6 px-6 z-50">
            <button id="submit-btn" onclick="checkAllAndSubmit()" class="w-full bg-gothic-cyan text-[#030305] font-impact font-black text-2xl tracking-widest uppercase py-4 rounded-xl shadow-[0_0_20px_rgba(0,243,255,0.4)] transition-all active:scale-95 flex items-center justify-center gap-3 border-2 border-transparent hover:bg-[#030305] hover:text-gothic-cyan hover:border-gothic-cyan">
                <i class="fa-solid fa-bolt"></i>
                FINISH HOMEWORK
            </button>
        </div>

        <!-- Success Overlay -->
        <div id="success-overlay" class="fixed inset-0 bg-[#030305]/95 z-[100] flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 hidden">
            <div class="w-32 h-32 bg-gothic-panel border-4 border-gothic-cyan rounded-full flex items-center justify-center mb-6 shadow-cyan-glow transform scale-50 transition-transform duration-500" id="success-badge">
                <span class="text-6xl text-gothic-cyan">🦸</span>
            </div>
            <h1 class="font-impact font-black text-5xl text-white mb-2 text-center uppercase tracking-widest">SAVED!</h1>
            <div class="bg-gothic-panel border border-gothic-cyan px-8 py-2 rounded-xl mb-6 mt-4 shadow-panel">
                <div class="font-mono text-gothic-cyan text-2xl font-bold tracking-widest" id="final-score">SCORE: 15/15</div>
            </div>
            <p class="font-sans text-gray-400 text-sm mb-10 text-center max-w-[280px]">Your emergency commands are flawless. The teacher is very proud of your progress!</p>
            <button onclick="location.reload()" class="bg-transparent border-2 border-gothic-cyan text-gothic-cyan font-impact font-bold px-10 py-4 rounded-lg uppercase text-xl tracking-widest hover:bg-gothic-cyan hover:text-black transition-colors shadow-cyan-glow">REDO CHALLENGE</button>
        </div>

    </div>

    <!-- Scripts -->
    <script>
        const quizData = [
            { q: "1. What is an Imperative?", a: ["A question.", "A command with no subject.", "A sentence about the past."], c: 1 },
            { q: "2. Which sentence is a command?", a: ["You save me.", "Save me!", "She saves me."], c: 1 },
            { q: "3. How do you make a negative command?", a: ["Not + Verb", "No + Verb", "Don't + Verb"], c: 2 },
            { q: "4. '______ my hand!' (Command)", a: ["Holding", "Hold", "You hold"], c: 1 },
            { q: "5. 'Call ______ name.'", a: ["me", "my", "I"], c: 1 },
            { q: "6. 'Save ______ from the dark.'", a: ["my", "me", "I"], c: 1 },
            { q: "7. What does 'Wake up' mean?", a: ["To stop sleeping.", "To fall asleep.", "To walk outside."], c: 0 },
            { q: "8. '______ let me fall!' (Negative)", a: ["No", "Not", "Don't"], c: 2 },
            { q: "9. What is the opposite of 'Inside'?", a: ["Under", "Outside", "Dark"], c: 1 },
            { q: "10. 'Bring ______ to life.'", a: ["me", "my", "you"], c: 0 },
            { q: "11. Look at ______ eyes.", a: ["me", "my", "I"], c: 1 },
            { q: "12. What does 'Blood' mean?", a: ["The red liquid inside your body.", "The dark sky at night.", "A beautiful flower."], c: 0 },
            { q: "13. In the song, the singer feels...", a: ["Happy and energetic.", "Numb and asleep inside.", "Hungry."], c: 1 },
            { q: "14. '______ touch that!' (Negative)", a: ["Don't", "You not", "No"], c: 0 },
            { q: "15. The music video shows the singer...", a: ["Sleepwalking.", "Driving a car.", "Cooking dinner."], c: 0 }
        ];

        let userAnswers = Array(15).fill(null);
        let solvedCount = 0;

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            const progress = document.getElementById('progress-container');
            
            quizData.forEach((item, idx) => {
                // Create Progress Dot
                const dot = document.createElement('div');
                dot.className = `h-2 flex-1 bg-[#030305] border border-gray-800 rounded-full progress-point dot-${idx}`;
                progress.appendChild(dot);

                // Create Card
                const card = document.createElement('div');
                card.className = `question-card rounded-xl p-6 shadow-panel q-card-${idx}`;
                card.innerHTML = `
                    <p class="font-sans text-xl font-bold mb-5 tracking-wide text-white leading-snug">${item.q}</p>
                    <div class="grid grid-cols-1 gap-3 font-impact tracking-wider text-base uppercase">
                        ${item.a.map((opt, oIdx) => `
                            <button class="option-btn border text-gray-300 py-4 px-4 rounded-lg text-left flex items-center justify-between group btn-${idx}-${oIdx}" onclick="answer(${idx}, ${oIdx})">
                                <span>${opt}</span>
                                <div class="w-5 h-5 rounded-full border border-gray-600 group-hover:border-gothic-cyan transition-colors flex items-center justify-center text-xs"></div>
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function answer(qIdx, oIdx) {
            if (userAnswers[qIdx] !== null) return; // Locked once answered

            const correct = quizData[qIdx].c;
            const btn = document.querySelector(`.btn-${qIdx}-${oIdx}`);
            const card = document.querySelector(`.q-card-${qIdx}`);
            const dot = document.querySelector(`.dot-${qIdx}`);
            const allBtnsInCard = card.querySelectorAll('.option-btn');

            // Disable all buttons in this card
            allBtnsInCard.forEach(b => b.disabled = true);

            if (oIdx === correct) {
                // Correct
                btn.classList.add('correct');
                btn.classList.remove('text-gray-300', 'bg-[#030305]');
                btn.querySelector('div').innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-[#030305]';
                userAnswers[qIdx] = true;
            } else {
                // Wrong
                btn.classList.add('wrong');
                btn.classList.remove('text-gray-300', 'bg-[#030305]');
                btn.querySelector('div').innerHTML = '<i class="fa-solid fa-xmark"></i>';
                btn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-white';
                
                // Highlight correct one too
                const correctBtn = document.querySelector(`.btn-${qIdx}-${correct}`);
                correctBtn.classList.add('correct');
                correctBtn.classList.remove('text-gray-300', 'bg-[#030305]');
                correctBtn.querySelector('div').innerHTML = '<i class="fa-solid fa-check"></i>';
                correctBtn.querySelector('div').className = 'w-5 h-5 flex items-center justify-center text-xs border-none text-[#030305]';
                
                card.classList.add('shake');
                userAnswers[qIdx] = false;
            }

            dot.classList.add('filled');
            solvedCount++;
            updateHeader();
        }

        function updateHeader() {
            const scoreLabel = document.getElementById('score-counter');
            scoreLabel.innerText = `SCORE: ${solvedCount}/15`;
            
            // Visual feedback on header update
            scoreLabel.classList.add('text-white');
            scoreLabel.classList.remove('text-gothic-cyan');
            setTimeout(() => {
                scoreLabel.classList.remove('text-white');
                scoreLabel.classList.add('text-gothic-cyan');
            }, 300);
        }

        function checkAllAndSubmit() {
            if (solvedCount < 15) {
                const btn = document.getElementById('submit-btn');
                btn.classList.add('shake', 'bg-gothic-red', 'text-white', 'border-gothic-red');
                btn.classList.remove('bg-gothic-cyan', 'text-[#030305]', 'border-transparent');
                btn.innerHTML = "INCOMPLETE DATA!";
                setTimeout(() => {
                    btn.classList.remove('shake', 'bg-gothic-red', 'text-white', 'border-gothic-red');
                    btn.classList.add('bg-gothic-cyan', 'text-[#030305]', 'border-transparent');
                    btn.innerHTML = `<i class="fa-solid fa-bolt"></i> FINISH HOMEWORK`;
                }, 1500);
                return;
            }

            // Calculate final score
            const finalCorrect = userAnswers.filter(a => a === true).length;
            const overlay = document.getElementById('success-overlay');
            const badge = document.getElementById('success-badge');
            
            document.getElementById('final-score').innerText = `SCORE: ${finalCorrect} / 15`;
            
            overlay.style.display = 'flex';
            void overlay.offsetWidth;
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                badge.classList.remove('scale-50');
                badge.classList.add('scale-100');
                shootConfetti();
            }, 100);
        }

        function shootConfetti() {
            const container = document.getElementById('app-container');
            const colors = ['#00f3ff', '#ff003c', '#f8fafc'];
            for(let i=0; i<60; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.animation = `fall ${Math.random()*2+2}s linear forwards`;
                c.style.animationDelay = Math.random()*0.5+'s';
                container.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
